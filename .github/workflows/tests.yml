name: Automated UI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run automated tests
        run: |
          python -m pytest -v test_login.py --browser chromium \
            --screenshot on --full-page-screenshot \
            --tracing retain-on-failure --output test-results \
            --junitxml=reports/results.xml \
            --html=reports/report.html --self-contained-html

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_number }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 30
